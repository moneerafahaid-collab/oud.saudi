<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>اختبار المسح الميداني — درون</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --g: #1A4731;
      --gd: #0F2E1F;
      --gold: #C9A84C;
      --warn: #D97706;
      --danger: #B91C1C;
      --soil: #7C5E3C;
      --muted: #6B7C6B;
      --bg: #F4F6F3;
      --panel: #ffffff;
      --border: #D8E0D6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "IBM Plex Sans Arabic", sans-serif;
      background: var(--bg);
      color: var(--gd);
      height: 100vh;
      overflow: hidden;
    }
    .shell {
      display: grid;
      grid-template-columns: 380px 1fr;
      height: 100vh;
      overflow: hidden;
    }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; grid-template-rows: minmax(340px, 58vh) 1fr; }
      .side { max-height: none; overflow: hidden; min-height: 0; }
      .side-head { padding: 0.7rem 1rem; }
      .side-head h1 { font-size: 1rem; }
      .side-head p { display: none; }
    }

    /* Sidebar */
    .side {
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 5;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }
    .side-head {
      padding: 1.1rem 1.25rem;
      background: linear-gradient(135deg, var(--gd), var(--g));
      color: #fff;
    }
    .side-head .tag {
      display: inline-block;
      background: var(--gold);
      color: var(--gd);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      margin-bottom: 0.55rem;
    }
    .side-head h1 { font-size: 1.15rem; font-weight: 700; line-height: 1.4; }
    .side-head p { font-size: 0.78rem; color: #B8D0B8; margin-top: 0.35rem; }

    .steps {
      display: flex;
      gap: 0.35rem;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .step-dot {
      flex: 1;
      min-width: 48px;
      text-align: center;
      font-size: 0.65rem;
      color: var(--muted);
    }
    .step-dot .bar {
      height: 4px;
      border-radius: 99px;
      background: #E2E8E0;
      margin-bottom: 0.35rem;
    }
    .step-dot.active .bar { background: var(--gold); }
    .step-dot.done .bar { background: var(--g); }
    .step-dot.active { color: var(--g); font-weight: 700; }

    .side-head, .steps, .side-foot { flex-shrink: 0; }
    .side-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: scroll;
      overflow-x: hidden;
      overscroll-behavior: contain;
      padding: 1.1rem 1.25rem;
      -webkit-overflow-scrolling: touch;
    }
    .side-body::-webkit-scrollbar { width: 10px; }
    .side-body::-webkit-scrollbar-thumb {
      background: #C5D2C4;
      border-radius: 8px;
    }
    .side-body::-webkit-scrollbar-track { background: #F0F4EF; }
    .side-body h2 {
      font-size: 1.05rem;
      margin-bottom: 0.4rem;
    }
    .side-body .desc {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 1rem;
    }

    .card {
      background: #F7FAF6;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem;
      margin-bottom: 0.75rem;
    }
    .card h3 {
      font-size: 0.82rem;
      color: var(--g);
      margin-bottom: 0.45rem;
    }
    .metric {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      padding: 0.35rem 0;
      border-bottom: 1px dashed #E0E8DC;
    }
    .metric:last-child { border-bottom: 0; }
    .metric strong { color: var(--gd); font-variant-numeric: tabular-nums; }
    .badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }
    .badge.ok { background: #D1FAE5; color: #065F46; }
    .badge.warn { background: #FEF3C7; color: #92400E; }
    .badge.danger { background: #FEE2E2; color: #991B1B; }
    .badge.info { background: #E0E7FF; color: #3730A3; }

    .log {
      max-height: 140px;
      overflow: auto;
      font-size: 0.75rem;
      background: var(--gd);
      color: #C8E0C8;
      border-radius: 8px;
      padding: 0.7rem;
      line-height: 1.65;
      font-family: ui-monospace, monospace;
      direction: ltr;
      text-align: left;
    }
    .log .line { opacity: 0; animation: fadeIn 0.35s forwards; }
    @keyframes fadeIn { to { opacity: 1; } }

    .side-foot {
      padding: 0.9rem 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.5rem;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.7rem 1rem;
      transition: 0.15s;
    }
    .btn-primary {
      flex: 1;
      background: var(--gold);
      color: var(--gd);
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: #F0F4EF; }

    /* Map */
    .map-wrap { position: relative; min-height: 0; }
    #map { width: 100%; height: 100%; background: #1a2e1a; }
    .map-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background: rgba(15, 46, 31, 0.88);
      color: #fff;
      padding: 0.55rem 0.85rem;
      border-radius: 8px;
      font-size: 0.75rem;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(201, 168, 76, 0.35);
      pointer-events: none;
    }
    .map-overlay strong { color: var(--gold); }

    .legend {
      position: absolute;
      bottom: 24px;
      left: 12px;
      z-index: 1000;
      background: rgba(255,255,255,0.95);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      font-size: 0.72rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      border: 1px solid var(--border);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin: 0.25rem 0;
    }
    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* Leaflet custom markers */
    .pin {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
    }
    .pin.seq { background: var(--warn); }
    .pin.infect { background: var(--danger); width: 34px; height: 34px; font-size: 14px; }
    .pin.waste { background: #B91C1C; border-radius: 4px; }
    .waste-label {
      background: rgba(185, 28, 28, 0.96);
      color: #fff;
      border: 2px solid #fff;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      font-family: "IBM Plex Sans Arabic", sans-serif;
      white-space: nowrap;
      text-align: center;
      line-height: 1.35;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      min-width: 118px;
    }
    .waste-label .waste-ico {
      display: inline-block;
      margin-left: 4px;
      font-size: 12px;
    }
    .waste-label small { display: block; font-size: 10px; font-weight: 600; opacity: 0.95; }
    .hum-label {
      background: rgba(230, 126, 34, 0.95);
      color: #fff;
      border: 1px solid #fff;
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 700;
      font-family: "IBM Plex Sans Arabic", sans-serif;
      white-space: nowrap;
      text-align: center;
      line-height: 1.35;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }
    .hum-label small { display: block; font-size: 10px; font-weight: 600; opacity: 0.95; }
    .diag-box {
      background: #FFF7ED;
      border: 1px solid #FDBA74;
      border-radius: 8px;
      padding: 0.75rem;
      margin-top: 0.65rem;
      font-size: 0.78rem;
      line-height: 1.7;
      color: #9A3412;
    }
    .scenario-bad {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 8px;
      padding: 0.75rem;
      margin-top: 0.55rem;
      font-size: 0.78rem;
      line-height: 1.7;
      color: #991B1B;
    }
    .scenario-good {
      background: #ECFDF5;
      border: 1px solid #A7F3D0;
      border-radius: 8px;
      padding: 0.75rem;
      margin-top: 0.55rem;
      font-size: 0.78rem;
      line-height: 1.7;
      color: #065F46;
    }
    .scenario-bad strong, .scenario-good strong { display: block; margin-bottom: 0.25rem; }
    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin: 0.75rem 0;
    }
    .kpi {
      background: #F7FAF6;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.7rem 0.65rem;
      text-align: center;
    }
    .kpi .kpi-val {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--gd);
      line-height: 1.2;
      margin-bottom: 0.2rem;
    }
    .kpi .kpi-label {
      font-size: 0.68rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .kpi.warn .kpi-val { color: #C2410C; }
    .kpi.danger .kpi-val { color: #B91C1C; }
    .kpi.ok .kpi-val { color: #047857; }
    .kpi.gold .kpi-val { color: #92640A; }
    .export-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.75rem;
    }
    .export-row button {
      flex: 1;
      min-width: 120px;
      padding: 0.6rem 0.7rem;
      font-size: 0.78rem;
    }
    .btn-download {
      background: var(--g);
      color: #fff;
    }
    .btn-json {
      background: #1E3A5F;
      color: #fff;
    }
    .pin.soil { background: var(--soil); }
    .pin.drone {
      background: var(--gold);
      color: var(--gd);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(201,168,76,0.6); }
      50% { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(201,168,76,0); }
    }

    .scan-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      background: rgba(15,46,31,0.92);
      color: #fff;
      padding: 1rem 1.5rem;
      border-radius: 12px;
      text-align: center;
      border: 1px solid var(--gold);
      display: none;
    }
    .scan-banner.show { display: block; animation: fadeIn 0.3s; }
    .scan-banner .spin {
      width: 28px; height: 28px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      margin: 0 auto 0.6rem;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .done-box {
      text-align: center;
      padding: 0.5rem 0 1rem;
    }
    .done-box .check {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: #D1FAE5;
      color: #065F46;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin: 0 auto 0.75rem;
    }
    .edit-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.75rem;
    }
    .edit-row button {
      flex: 1;
      min-width: 110px;
      padding: 0.55rem 0.7rem;
      font-size: 0.8rem;
    }
    .btn-edit {
      background: var(--g);
      color: #fff;
    }
    .btn-save {
      background: var(--gold);
      color: var(--gd);
    }
    .hint-edit {
      margin-top: 0.65rem;
      padding: 0.55rem 0.7rem;
      background: #FEF9EE;
      border: 1px solid #E8D7A8;
      border-radius: 8px;
      font-size: 0.75rem;
      color: #7A5C14;
      line-height: 1.6;
      display: none;
    }
    .hint-edit.show { display: block; }

    /* CWSI / thermal dashboard */
    .cwsi-gauge-wrap { text-align: center; margin: 0.2rem 0 0.55rem; }
    .cwsi-val {
      font-size: 1.7rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .cwsi-bar {
      height: 8px;
      border-radius: 99px;
      background: linear-gradient(90deg, #047857 0%, #D97706 50%, #B91C1C 100%);
      position: relative;
      margin: 0.45rem 0 0.25rem;
    }
    .cwsi-needle {
      position: absolute;
      top: -4px;
      width: 3px;
      height: 16px;
      background: #0F2E1F;
      border-radius: 2px;
      transform: translateX(-50%);
    }
    .cwsi-bands {
      display: flex;
      justify-content: space-between;
      font-size: 0.62rem;
      color: var(--muted);
    }
    .sim-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.55rem;
      align-items: center;
    }
    .sim-controls button {
      padding: 0.38rem 0.55rem;
      font-size: 0.72rem;
      border-radius: 6px;
    }
    .sim-controls button.on {
      background: var(--gold);
      color: var(--gd);
      border-color: var(--gold);
    }
    .toggle-live {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.72rem;
      margin-top: 0.45rem;
      cursor: pointer;
      user-select: none;
    }
    .hour-slider { width: 100%; margin-top: 0.35rem; accent-color: var(--gold); }
    .spark { display: block; width: 100%; height: 58px; margin-top: 0.25rem; }
    .thermal-hud {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: rgba(15, 46, 31, 0.9);
      color: #fff;
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      font-size: 0.72rem;
      border: 1px solid rgba(201, 168, 76, 0.4);
      min-width: 148px;
      display: none;
      line-height: 1.55;
    }
    .thermal-hud.show { display: block; }
    .thermal-hud b { color: var(--gold); }
    .pin.thermal {
      background: #7C3AED;
      animation: pulse 1.2s infinite;
    }
    .thermal-ag-canvas {
      pointer-events: none;
      z-index: 350;
      opacity: 0.93;
    }
    .flir-scale {
      position: absolute;
      bottom: 24px;
      right: 12px;
      z-index: 1000;
      background: rgba(8, 12, 18, 0.92);
      color: #fff;
      border-radius: 8px;
      padding: 0.5rem 0.55rem 0.55rem;
      display: none;
      border: 1px solid rgba(255, 180, 60, 0.35);
      font-size: 0.68rem;
      width: 52px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }
    .flir-scale.show { display: block; }
    .flir-scale .flir-title {
      font-size: 0.58rem;
      letter-spacing: 0.04em;
      color: #FDE68A;
      margin-bottom: 0.3rem;
      font-weight: 700;
    }
    .flir-gradient {
      height: 118px;
      width: 16px;
      margin: 0 auto;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.35);
      background: linear-gradient(
        to top,
        #163A8C 0%,
        #2E7BC8 18%,
        #3DA89A 36%,
        #7BC45A 52%,
        #E0C94A 68%,
        #E89A3A 84%,
        #C44A18 100%
      );
    }
    .flir-nums {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      margin-top: 0.35rem;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }
    .flir-nums .lo { color: #93C5FD; }
    .flir-nums .hi { color: #FDE68A; }
    .scan-line {
      position: absolute;
      left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #fff, #FDE68A, #fff, transparent);
      box-shadow: 0 0 12px #FDE68A;
      z-index: 450;
      display: none;
      pointer-events: none;
    }
    .scan-line.show { display: block; }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="side-head">
        <div class="tag">منصة عَود · اختبار ميداني</div>
        <h1>مسح الدرون ورصد المخلفات</h1>
        <p>تحديد المزرعة ← الدرون ← المخلفات ← رصد حراري ← المسار ← التقرير</p>
      </div>

      <div class="steps" id="stepDots"></div>

      <div class="side-body" id="stepContent"></div>

      <div class="side-foot">
        <button type="button" class="btn-ghost" id="btnBack" disabled>رجوع</button>
        <button type="button" class="btn-primary" id="btnNext">بدء التحديد</button>
      </div>
    </aside>

    <div class="map-wrap">
      <div id="map"></div>
      <div class="map-overlay" id="mapStatus">
        جاهز للمسح · <strong>مزرعة تجريبية — حائل</strong>
      </div>
      <div class="legend" id="legend"></div>
      <div class="thermal-hud" id="thermalHud"></div>
      <div class="flir-scale" id="flirScale">
        <div class="flir-title">LST °C</div>
        <div class="flir-gradient"></div>
        <div class="flir-nums">
          <span class="hi" id="flirMax">—</span>
          <span class="lo" id="flirMin">—</span>
        </div>
      </div>
      <div class="scan-line" id="thermalScanLine"></div>
      <div class="scan-banner" id="scanBanner">
        <div class="spin"></div>
        <div style="font-weight:700;margin-bottom:0.25rem">الدرون يقوم بالمسح…</div>
        <div style="font-size:0.75rem;color:#A8C8A8" id="scanPct">0%</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.min.js"></script>
  <script src="./cwsi-telemetry.js?v=aglst"></script>
  <script>
    /* ═══════════════════════════════════════════
       إحداثيات المزرعة التجريبية — شمال حائل
       (يمكن استبدالها بإحداثياتكم الحقيقية)
       ═══════════════════════════════════════════ */
    /* ═══════════════════════════════════════════
       حدود مزرعة بن جميعة الوقفية — مكبّرة
       لتغطية كامل بستان النخيل (الجسم + الامتداد الجنوبي)
       الدبوس: 27.873171 , 41.714444
       ═══════════════════════════════════════════ */
    const FARM = {
      id: "FARM-BIN-JUMAIAH",
      name: "مزرعة بن جميعة الوقفية",
      // حدود المزرعة الكبيرة (شكل L) لتطابق تحديدك
      boundary: [
        [27.87860, 41.70940],
        [27.87890, 41.71380],
        [27.87910, 41.71715],
        [27.87080, 41.71725],
        [27.86240, 41.71735],
        [27.86230, 41.71590],
        [27.87060, 41.71580],
        [27.87040, 41.70960],
      ],
      center: [27.87050, 41.71440],
      waste: [
        {
          id: "W1",
          label: "مخلفات نباتية",
          tons: 3.5,
          // 27.871338, 41.715910
          bounds: [[27.87100, 41.71555], [27.87168, 41.71627]],
        },
        {
          id: "W2",
          label: "مخلفات نباتية",
          tons: 5.0,
          // 27.875557, 41.714182
          bounds: [[27.87522, 41.71382], [27.87590, 41.71454]],
        },
        {
          id: "W3",
          label: "مخلفات نباتية",
          tons: 4.5,
          // 27.865765, 41.721484
          bounds: [[27.86543, 41.72112], [27.86610, 41.72185]],
        },
      ],
      infection: {

    // ── Soil calculation ──
    function calcSoilScore(r) {
      // مؤشر بسيط لصحة التربة (0–100)
      let score = 70;
      // رطوبة مثالية 25–40%
      if (r.moisture >= 25 && r.moisture <= 40) score += 10;
      else if (r.moisture < 15 || r.moisture > 55) score -= 15;
      else score -= 5;
      // pH مثالي 6.5–7.5 للنخيل
      if (r.ph >= 6.5 && r.ph <= 7.5) score += 10;
      else score -= 10;
      // ملوحة EC — أقل من 2 جيد
      if (r.ec < 2) score += 8;
      else if (r.ec < 4) score -= 5;
      else score -= 15;
      // نيتروجين
      if (r.nitrogen >= 30 && r.nitrogen <= 60) score += 5;
      return Math.max(0, Math.min(100, Math.round(score)));
    }

    function soilVerdict(score) {
      if (score >= 80) return { text: "تربة جيدة", cls: "ok" };
      if (score >= 60) return { text: "مقبولة — متابعة", cls: "warn" };
      return { text: "تحتاج تدخل", cls: "danger" };
    }

    async function runDroneScan() {
      clearAllOverlays();
      showFarm();
      const banner = document.getElementById("scanBanner");
      banner.classList.add("show");
      document.getElementById("btnNext").disabled = true;

      const path = FARM.boundary.concat([FARM.boundary[0]]);
      const drone = L.marker(path[0], { icon: pinIcon("drone", "✈") }).addTo(map);
      layers.drone = drone;

      // خط مسار المسح
      const scanLine = L.polyline([], {
        color: GOLD,
        weight: 2,
        dashArray: "4 8",
        opacity: 0.9,
      }).addTo(map);
      layers.scanLine = scanLine;

      const pts = [];
      // مسار متعرج داخل المزرعة (محاكاة مسح شريطي)
      const bounds = L.latLngBounds(FARM.boundary);
      const sw = bounds.getSouthWest();
      const ne = bounds.getNorthEast();
      const rows = 6;
      for (let i = 0; i < rows; i++) {
        const lat = sw.lat + ((ne.lat - sw.lat) * (i + 0.5) / rows);
        if (i % 2 === 0) {
          pts.push([lat, sw.lng + 0.0003], [lat, ne.lng - 0.0003]);
        } else {
          pts.push([lat, ne.lng - 0.0003], [lat, sw.lng + 0.0003]);
        }
      }

      const trail = [];
      for (let i = 0; i < pts.length; i++) {
        await wait(280);
        drone.setLatLng(pts[i]);
        trail.push(pts[i]);
        scanLine.setLatLngs(trail);
        const pct = Math.round(((i + 1) / pts.length) * 100);
        document.getElementById("scanPct").textContent = pct + "%";
        setStatus(`مسح الدرون جارٍ · <strong>${pct}%</strong>`);
        addLog(`DRONE scan strip ${i + 1}/${pts.length}`);
        renderStepBody(); // refresh log
      }

      // بعد المسح: حدود صلبة بدل متقطعة
      clearLayer("farm");
      layers.farm = L.polygon(FARM.boundary, {
        color: EDGE,
        weight: 4,
        fillColor: EDGE,
        fillOpacity: 0.18,
      }).addTo(map);

      banner.classList.remove("show");
      scanDone = true;
      document.getElementById("btnNext").disabled = false;
      setStatus(`اكتمل المسح · <strong>تم ترسيم حدود المزرعة</strong>`);
      addLog("SCAN complete — farm boundary locked");
      setLegend([
        { color: EDGE, label: "حواف بعد المسح" },
        { color: "#C9A84C", label: "مسار الدرون" },
      ]);
      renderStepBody();
    }

    function pointOnCircle(center, radiusM, bearingDeg) {
      const rad = (bearingDeg * Math.PI) / 180;
      const dLat = (radiusM * Math.cos(rad)) / 110860;
      const dLng = (radiusM * Math.sin(rad)) / (98400 * Math.cos((center[0] * Math.PI) / 180));
      return [center[0] + dLat, center[1] + dLng];
    }

    function hash2(ix, iy) {
      let n = (ix * 374761393 + iy * 668265263) | 0;
      n = Math.imul(n ^ (n >>> 13), 1274126177);
      return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
    }

    function pointInFarm(lat, lng) {
      const pts = FARM.boundary;
      let inside = false;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const yi = pts[i][0], xi = pts[i][1];
        const yj = pts[j][0], xj = pts[j][1];
        const intersect = ((yi > lat) !== (yj > lat)) &&
          (lng < ((xj - xi) * (lat - yi)) / ((yj - yi) || 1e-12) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function distM(a, b) {
      const dlat = (a[0] - b[0]) * ThermalAg.mLat;
      const dlng = (a[1] - b[1]) * ThermalAg.mLng;
      return Math.hypot(dlat, dlng);
    }

    function sceneTemperature(lat, lng, hour) {
      const C = window.CwsiTelemetry;
      const Ta = C.airTemp(hour);
      const sun = C.solarRadiation(hour) / 1000;
      const x = (lng - ThermalAg.origin.lng) * ThermalAg.mLng;
      const y = (lat - ThermalAg.origin.lat) * ThermalAg.mLat;
      const n = hash2(Math.floor(x / 28), Math.floor(y / 28));
      const desert = Ta + 9 + sun * 8 + (n - 0.5) * 1.4;
      const inf = FARM.infection;
      const dInf = distM([lat, lng], inf.target);

      if (pointInFarm(lat, lng)) {
        const patch = hash2(Math.floor(x / 55), Math.floor(y / 55));
        let T = Ta + 1.2 + sun * 2.4 + (patch - 0.5) * 2.8;
        T += Math.exp(-((dInf / ((inf.radiusM || 98) * 0.7)) ** 2)) * (5.5 + sun * 2);
        (FARM.waste || []).forEach((w) => {
          const c = [(w.bounds[0][0] + w.bounds[1][0]) / 2, (w.bounds[0][1] + w.bounds[1][1]) / 2];
          const dw = distM([lat, lng], c);
          if (dw < 40) T += (1 - dw / 40) * 2.2;
        });
        return T;
      }

      const cx = Math.round(x / 480) * 480;
      const cy = Math.round(y / 480) * 480;
      const pr = 150 + hash2(cx / 8, cy / 8) * 110;
      const dPivot = Math.hypot(x - cx, y - cy);
      if (dPivot < pr && hash2(cx, cy) > 0.28) {
        const vigor = 0.35 + hash2(cx + 3, cy + 1) * 0.55;
        return desert - (7 + sun * 3) * vigor * (1 - dPivot / pr) + (n - 0.5);
      }
      return desert;
    }

    function destroyThermalAg() {
      if (ThermalAg._onView) {
        map.off("move", ThermalAg._onView);
        map.off("zoom", ThermalAg._onView);
        map.off("viewreset", ThermalAg._onView);
        ThermalAg._onView = null;
      }
      if (ThermalAg._onRebuild) {
        map.off("moveend", ThermalAg._onRebuild);
        map.off("zoomend", ThermalAg._onRebuild);
        map.off("resize", ThermalAg._onRebuild);
        ThermalAg._onRebuild = null;
      }
      if (ThermalAg._onClick) {
        map.off("click", ThermalAg._onClick);
        ThermalAg._onClick = null;
      }
      if (ThermalAg.canvas && ThermalAg.canvas.parentNode) {
        ThermalAg.canvas.parentNode.removeChild(ThermalAg.canvas);
      }
      ThermalAg.canvas = null;
      ThermalAg.ctx = null;
      ThermalAg.lastBufHour = -1;
    }

    function latLngToTile(lat, lng, z) {
      const n = 2 ** z;
      const x = Math.floor(((lng + 180) / 360) * n);
      const latRad = (lat * Math.PI) / 180;
      const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
      return { x, y };
    }

    function loadSatTile(z, x, y) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        const t = setTimeout(() => resolve(null), 3500);
        img.onload = () => { clearTimeout(t); resolve(img); };
        img.onerror = () => { clearTimeout(t); resolve(null); };
        img.src = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;
      });
    }

    function viewSourceKey() {
      const c = map.getCenter();
      return `${Math.round(map.getZoom())}:${c.lat.toFixed(3)}:${c.lng.toFixed(3)}:${ThermalAg.BW}x${ThermalAg.BH}`;
    }

    async function captureSatelliteRgb() {
      const z = Math.min(18, Math.max(12, Math.round(map.getZoom())));
      const size = mapCssSize();
      const w = ThermalAg.BW;
      const h = ThermalAg.BH;
      const nw = map.containerPointToLatLng([0, 0]);
      const se = map.containerPointToLatLng([size.x, size.y]);
      const a = latLngToTile(nw.lat, nw.lng, z);
      const b = latLngToTile(se.lat, se.lng, z);
      const minX = Math.min(a.x, b.x) - 1;
      const maxX = Math.max(a.x, b.x) + 1;
      const minY = Math.min(a.y, b.y) - 1;
      const maxY = Math.max(a.y, b.y) + 1;
      const tiles = {};
      const jobs = [];
      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          jobs.push(loadSatTile(z, x, y).then((img) => { tiles[`${x},${y}`] = img; }));
        }
      }
      await Promise.all(jobs);
      const pix = {};
      const tmp = document.createElement("canvas");
      tmp.width = 256;
      tmp.height = 256;
      const tctx = tmp.getContext("2d");
      Object.keys(tiles).forEach((k) => {
        if (!tiles[k]) return;
        tctx.clearRect(0, 0, 256, 256);
        tctx.drawImage(tiles[k], 0, 0);
        pix[k] = tctx.getImageData(0, 0, 256, 256).data;
      });
      const rgb = new Uint8Array(w * h * 3);
      let hits = 0;
      for (let row = 0; row < h; row++) {
        const py = (row / Math.max(1, h - 1)) * size.y;
        for (let col = 0; col < w; col++) {
          const px = (col / Math.max(1, w - 1)) * size.x;
          const ll = map.containerPointToLatLng([px, py]);
          const p = map.project(ll, z);
          const tx = Math.floor(p.x / 256);
          const ty = Math.floor(p.y / 256);
          const data = pix[`${tx},${ty}`];
          const o = (row * w + col) * 3;
          if (!data) continue;
          const ox = ((Math.floor(p.x) % 256) + 256) % 256;
          const oy = ((Math.floor(p.y) % 256) + 256) % 256;
          const i = (oy * 256 + ox) * 4;
          rgb[o] = data[i];
          rgb[o + 1] = data[i + 1];
          rgb[o + 2] = data[i + 2];
          hits++;
        }
      }
      if (hits < w * h * 0.2) {
        ThermalAg.sourceRgb = null;
        return false;
      }
      ThermalAg.sourceRgb = rgb;
      return true;
    }

    function hotnessFromSample(r, g, b, lat, lng, hour) {
      const veg = (g - r) / (Math.abs(r) + Math.abs(g) + 10);
      const lum = (0.28 * r + 0.57 * g + 0.15 * b) / 255;
      let cool = veg * 1.7 + (0.5 - lum) * 0.5;
      cool = (cool + 0.28) / 1.05;
      if (pointInFarm(lat, lng)) {
        cool = Math.max(cool, 0.58) + 0.14 + veg * 0.12;
      }
      const dInf = distM([lat, lng], FARM.infection.target);
      const R = FARM.infection.radiusM || 98;
      if (dInf < R) cool -= 0.32 * (1 - dInf / R);
      const sun = window.CwsiTelemetry.solarRadiation(hour) / 1000;
      cool -= Math.max(0, -veg) * sun * 0.08;
      return 1 - Math.max(0, Math.min(1, cool));
    }

    function paintBufferFromData(hour) {
      const C = window.CwsiTelemetry;
      const w = ThermalAg.BW;
      const h = ThermalAg.BH;
      const mapSize = mapCssSize();
      if (!ThermalAg.buf || ThermalAg.buf.width !== w || ThermalAg.buf.height !== h) {
        ThermalAg.buf = document.createElement("canvas");
        ThermalAg.buf.width = w;
        ThermalAg.buf.height = h;
        ThermalAg.bufCtx = ThermalAg.buf.getContext("2d");
      }
      const img = ThermalAg.bufCtx.createImageData(w, h);
      const src = ThermalAg.sourceRgb;
      let tMin = 99;
      let tMax = -20;
      const temps = new Float32Array(w * h);
      const Ta = C.airTemp(hour);

      for (let row = 0; row < h; row++) {
        const py = (row / Math.max(1, h - 1)) * mapSize.y;
        for (let col = 0; col < w; col++) {
          const px = (col / Math.max(1, w - 1)) * mapSize.x;
          const ll = map.containerPointToLatLng([px, py]);
          let T;
          if (src) {
            const o = (row * w + col) * 3;
            const hot = hotnessFromSample(src[o], src[o + 1], src[o + 2], ll.lat, ll.lng, hour);
            T = Ta + 2 + hot * 18;
          } else {
            T = sceneTemperature(ll.lat, ll.lng, hour);
          }
          temps[row * w + col] = T;
          if (T < tMin) tMin = T;
          if (T > tMax) tMax = T;
        }
      }

      ThermalAg.tMin = tMin;
      ThermalAg.tMax = tMax;
      const span = Math.max(4, tMax - tMin);
      for (let i = 0; i < temps.length; i++) {
        const rgb = C.ironbow((temps[i] - tMin) / span);
        const o = i * 4;
        img.data[o] = rgb[0];
        img.data[o + 1] = rgb[1];
        img.data[o + 2] = rgb[2];
        img.data[o + 3] = 245;
      }
      ThermalAg.bufCtx.putImageData(img, 0, 0);
      ThermalAg.lastBufHour = hour;
      const flirMax = document.getElementById("flirMax");
      const flirMin = document.getElementById("flirMin");
      if (flirMax) flirMax.textContent = tMax.toFixed(1);
      if (flirMin) flirMin.textContent = tMin.toFixed(1);
    }

    async function rebuildThermalBuffer(hour) {
      const job = ++ThermalAg.job;
      sizeThermalBufferFromView();
      ThermalAg.bounds = map.getBounds();
      ThermalAg.origin = { lat: ThermalAg.bounds.getSouth(), lng: ThermalAg.bounds.getWest() };
      ThermalAg.mLng = 98400 * Math.cos((FARM.center[0] * Math.PI) / 180);
      const key = viewSourceKey();
      if (ThermalAg.sourceKey !== key) {
        ThermalAg.sourceRgb = null;
        await captureSatelliteRgb();
        if (job !== ThermalAg.job) return;
        ThermalAg.sourceKey = key;
      }
      paintBufferFromData(hour);
      blitThermalAg();
    }

    function blitThermalAg() {
      if (!ThermalAg.canvas || !ThermalAg.buf) return;
      const size = mapCssSize();
      const w = Math.max(2, Math.round(size.x));
      const h = Math.max(2, Math.round(size.y));
      const canvas = ThermalAg.canvas;
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      const tl = map.containerPointToLayerPoint([0, 0]);
      L.DomUtil.setPosition(canvas, tl);
      const ctx = ThermalAg.ctx;
      ctx.clearRect(0, 0, w, h);
      const visH = Math.max(1, Math.round(h * ThermalAg.reveal));
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(ThermalAg.buf, 0, 0, ThermalAg.BW, Math.round(ThermalAg.BH * ThermalAg.reveal), 0, 0, w, visH);
    }

    function mapCssSize() {
      const el = map.getContainer();
      return { x: el.clientWidth || map.getSize().x, y: el.clientHeight || map.getSize().y };
    }

    function sizeThermalBufferFromView() {
      const size = mapCssSize();
      const aspect = size.x / Math.max(1, size.y);
      const maxPix = 480;
      if (aspect >= 1) {
        ThermalAg.BW = maxPix;
        ThermalAg.BH = Math.max(180, Math.round(maxPix / aspect));
      } else {
        ThermalAg.BH = maxPix;
        ThermalAg.BW = Math.max(180, Math.round(maxPix * aspect));
      }
    }

    async function syncThermalToMapView(rebuild) {
      if (rebuild) {
        ThermalAg.lastBufHour = -1;
        await rebuildThermalBuffer(ThermalAg.hour);
        return;
      }
      blitThermalAg();
    }

    function positionThermalAg() {
      blitThermalAg();
    }

    function paintThermalGrid(hour) {
      if (!ThermalAg.canvas) return;
      ThermalAg.hour = hour;
      if (ThermalAg.sourceRgb || ThermalAg.buf) {
        if (Math.abs(hour - ThermalAg.lastBufHour) > 0.1) paintBufferFromData(hour);
        blitThermalAg();
        return;
      }
      rebuildThermalBuffer(hour);
    }

    async function buildThermalGrid() {
      destroyThermalAg();
      map.invalidateSize();
      map.fitBounds(L.latLngBounds(FARM.boundary), { padding: [28, 28], maxZoom: 17, animate: false });
      ThermalAg.reveal = 1;
      const canvas = L.DomUtil.create("canvas", "thermal-ag-canvas");
      map.getPanes().overlayPane.appendChild(canvas);
      ThermalAg.canvas = canvas;
      ThermalAg.ctx = canvas.getContext("2d");
      ThermalAg._onView = () => positionThermalAg();
      ThermalAg._onRebuild = () => {
        clearTimeout(ThermalAg._deb);
        ThermalAg._deb = setTimeout(() => syncThermalToMapView(true), 240);
      };
      ThermalAg._onClick = (e) => {
        const T = sceneTemperature(e.latlng.lat, e.latlng.lng, ThermalAg.hour);
        const n = (T - ThermalAg.tMin) / Math.max(4, ThermalAg.tMax - ThermalAg.tMin);
        const zone = pointInFarm(e.latlng.lat, e.latlng.lng) ? "داخل المزرعة المحددة" : "خارج الحدود";
        L.popup()
          .setLatLng(e.latlng)
          .setContent(
            `<div dir="rtl" style="font-family:sans-serif;min-width:150px">
              <b>تصوير حراري زراعي</b> · ${zone}<br/>
              حرارة ظاهرية <b>${T.toFixed(1)} °C</b><br/>
              <span dir="ltr">${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}</span>
              <div style="margin-top:6px;height:8px;border-radius:4px;background:${window.CwsiTelemetry.ironbowCss(n)}"></div>
            </div>`
          )
          .openOn(map);
      };
      map.on("click", ThermalAg._onClick);
      await syncThermalToMapView(true);
      map.on("move", ThermalAg._onView);
      map.on("zoom", ThermalAg._onView);
      map.on("viewreset", ThermalAg._onView);
      map.on("resize", ThermalAg._onRebuild);
      map.on("moveend", ThermalAg._onRebuild);
      map.on("zoomend", ThermalAg._onRebuild);
      const flir = document.getElementById("flirScale");
      if (flir) flir.classList.add("show");
    }

    function sparkSvg(history, key, color, lo, hi) {
      if (!history || history.length < 2) {
        return `<svg class="spark" viewBox="0 0 280 58"></svg>`;
      }
      const w = 280, h = 58, p = 4;
      const vals = history.map((x) => x[key]);
      const span = Math.max(0.04, hi - lo);
      const pts = vals.map((v, i) => {
        const x = p + (i / (vals.length - 1)) * (w - 2 * p);
        const y = h - p - ((v - lo) / span) * (h - 2 * p);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
      return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${color}" stroke-width="2.2" points="${pts}"/></svg>`;
    }

    function updateThermalHud(s) {
      const hud = document.getElementById("thermalHud");
      if (!hud || !s) return;
      hud.classList.add("show");
      hud.innerHTML =
        `تصوير حراري زراعي · <b>${s.timestamp}</b><br/>` +
        `CWSI <b>${s.cwsi.toFixed(2)}</b> · Tc ${s.Tc}°C<br/>` +
        `المشهد ${ThermalAg.tMin.toFixed(1)}–${ThermalAg.tMax.toFixed(1)}°C`;
    }

    function onThermalTick(state) {
      lastThermal = state;
      thermalHistory.push(state.sample);
      if (thermalHistory.length > 80) thermalHistory.shift();
      peakCwsi = Math.max(peakCwsi, state.sample.cwsi);
      paintThermalGrid(state.hour);
      updateInfectDashboard(state);
      updateThermalHud(state.sample);
      try {
        parent.postMessage({ type: "cwsi:tick", payload: state.sample }, "*");
      } catch (_) {}
    }

    function startThermalStream() {
      stopThermalStream();
      thermalHistory = [];
      const C = window.CwsiTelemetry;
      thermalStream = C.createStream({ zone: "infection", startHour: 10.5, intervalMs: 280 });
      thermalUnsub = thermalStream.subscribe(onThermalTick);
    }

    function bindInfectControls() {
      const play = document.getElementById("cwsiPlay");
      if (play) {
        play.onclick = () => {
          if (!thermalStream) return;
          const st = thermalStream.snapshot();
          st.playing ? thermalStream.pause() : thermalStream.play();
        };
      }
      document.querySelectorAll("[data-speed]").forEach((btn) => {
        btn.onclick = () => {
          if (!thermalStream) return;
          thermalStream.setLiveMode(false);
          thermalStream.setSpeed(Number(btn.getAttribute("data-speed")));
          const live = document.getElementById("cwsiLive");
          if (live) live.checked = false;
        };
      });
      const live = document.getElementById("cwsiLive");
      if (live) {
        live.onchange = () => thermalStream && thermalStream.setLiveMode(live.checked);
      }
      const slider = document.getElementById("cwsiHour");
      if (slider) {
        slider.oninput = () => {
          if (!thermalStream) return;
          const liveEl = document.getElementById("cwsiLive");
          if (liveEl) liveEl.checked = false;
          thermalStream.setHour(Number(slider.value) / 10);
        };
      }
      const sweep = document.getElementById("cwsiSweep");
      if (sweep) sweep.onclick = () => runObservationWindow();
    }

    function updateInfectDashboard(state) {

      document.getElementById("cwsiVal").style.color = C.cwsiColor(s.cwsi);

      badge.className = `badge ${bandClass(s.band)}`;
      document.getElementById("mTc").textContent = `${s.Tc} °C`;
      document.getElementById("mTa").textContent = `${s.Ta} °C`;
      document.getElementById("mVpd").textContent = `${s.VPD} kPa`;
      document.getElementById("mRs").textContent = `${s.Rs} W/m²`;
      document.getElementById("mRh").textContent = `${s.RH} %`;
      document.getElementById("mTime").textContent = s.timestamp;

      if (spark) spark.innerHTML = sparkSvg(thermalHistory, "cwsi", C.cwsiColor(s.cwsi), 0, 1);

      });

      }

    async function enterInfectionThermal() {
      observationDone = false;
      observationRunning = false;
      pathShown = false;
      infectUiReady = false;
      peakCwsi = 0;
      if (!layers.farm) showFarm();
      clearLayer("infectGroup");
      const group = L.layerGroup().addTo(map);
      layers.infectGroup = group;
      drawInfectionTarget(group);
      ThermalAg.hour = 10.5;
      renderStepBody();
      await wait(40);
      await buildThermalGrid();
      setStatus(`تصوير حراري زراعي · <strong>كامل المزرعة المحددة + المشهد</strong>`);
      addLog(`ALERT infection @ ${FARM.infection.target[0]}, ${FARM.infection.target[1]} r=${FARM.infection.radiusM}m`);
      addLog("THERMAL AG: FLIR ironbow overlay on orchard canopy/soil");
      if (layers.farm) layers.farm.setStyle({ fillOpacity: 0.04, weight: 3, color: "#163A8C" });
      setLegend([
        { color: "#163A8C", label: "بارد / مروي" },
        { color: "#3DA89A", label: "غطاء نباتي" },
        { color: "#E0C94A", label: "مختلط" },
        { color: "#C44A18", label: "صحراء / إجهاد حراري" },
      ]);
      startThermalStream();
      try { parent.postMessage({ type: "cwsi:phase", phase: "thermal" }, "*"); } catch (_) {}
    }

    async function runObservationWindow() {
      if (observationRunning) return;
      observationRunning = true;
      document.getElementById("btnNext").disabled = true;
      const sweepBtn = document.getElementById("cwsiSweep");
      if (sweepBtn) sweepBtn.disabled = true;
      setStatus(`نافذة رصد حراري · <strong>مسح المستشعر فوق منطقة الإصابة</strong>`);
      addLog("THERMAL observation window — sensor sweep");
      const group = layers.infectGroup;
      if (!group) {
        observationRunning = false;
        document.getElementById("btnNext").disabled = false;
        return;
      }
      if (!ThermalAg.canvas) await buildThermalGrid();
      const b = ThermalAg.bounds || L.latLngBounds(FARM.boundary);
      const north = b.getNorth();
      const south = b.getSouth();
      const west = b.getWest();
      const east = b.getEast();
      const midLng = (west + east) / 2;
      if (layers.thermalDrone) group.removeLayer(layers.thermalDrone);
      const drone = L.marker([north, midLng], { icon: pinIcon("thermal", "◉") }).addTo(group);
      layers.thermalDrone = drone;
      const trail = [];
      const line = L.polyline([], { color: "#FDE68A", weight: 2, opacity: 0.9 }).addTo(group);
      const scanEl = document.getElementById("thermalScanLine");
      ThermalAg.reveal = 1;
      blitThermalAg();

      const strips = 42;
      for (let i = 0; i <= strips; i++) {
        const t = i / strips;
        ThermalAg.reveal = t;
        blitThermalAg();
        const lat = north - t * (north - south);
        drone.setLatLng([lat, midLng]);
        trail.push([lat, midLng]);
        line.setLatLngs(trail);
        if (scanEl && mapWrap) {
          const pt = map.latLngToContainerPoint([lat, midLng]);
          scanEl.classList.add("show");
          scanEl.style.top = `${pt.y}px`;
        }
        setStatus(`مسح حراري FLIR · <strong>${Math.round(t * 100)}%</strong>`);
        await wait(55);
      }
      if (scanEl) scanEl.classList.remove("show");
      ThermalAg.reveal = 1;
      blitThermalAg();
      observationDone = true;
      observationRunning = false;
      const cw = lastThermal ? lastThermal.sample.cwsi.toFixed(2) : "—";
      addLog(`THERMAL sweep complete peakCWSI=${peakCwsi.toFixed(2)} last=${cw}`);
      setStatus(`رصد حراري مكتمل · <strong>CWSI ${cw} — جاهز لمسار الفريق</strong>`);
      document.getElementById("btnNext").disabled = false;
      updateButtons();
      updateInfectDashboard(lastThermal);
      try { parent.postMessage({ type: "cwsi:phase", phase: "observed" }, "*"); } catch (_) {}
    }

    async function showTeamPath() {
      const group = layers.infectGroup || L.layerGroup().addTo(map);
      layers.infectGroup = group;
      document.getElementById("btnNext").disabled = true;
      const path = FARM.infection.path || [];
      if (path.length > 0) {
        const linePts = [];
        const line = L.polyline([], {
          color: INFECT,
          weight: 3,
          dashArray: "6 8",
        }).addTo(group);

        for (let i = 0; i < path.length; i++) {
          await wait(450);
          linePts.push(path[i]);
          line.setLatLngs(linePts);
          const m = L.marker(path[i], {
            icon: pinIcon("seq", String(i + 1)),
          }).bindPopup(`<span dir="rtl">نقطة مسار ${i + 1} — توجيه الفريق</span>`);
          group.addLayer(m);
          setStatus(`مسار الفريق · <strong>نقطة ${i + 1} / ${path.length}</strong>`);
          addLog(`NAV point ${i + 1}`);
        }
        setStatus(`اشتباه إصابة · <strong>تعفن أسود مرصود — الفريق في الموقع</strong>`);
      }
      pathShown = true;
      document.getElementById("btnNext").disabled = false;
      setLegend([
        { color: "#047857", label: "CWSI مثالي" },
        { color: "#D97706", label: "إجهاد متوسط" },
        { color: "#B91C1C", label: "إجهاد حرج" },
        { color: INFECT, label: "مسار الفريق" },
      ]);
      updateButtons();
      try { parent.postMessage({ type: "cwsi:phase", phase: "path" }, "*"); } catch (_) {}
    }

    function showSoil() {
      if (!layers.farm) showFarm();
      clearLayer("soilPin");

      clearLayer("infectGroup");

      const s = FARM.soilSensor;

        .bindPopup(
          `<div dir="rtl"><b>حساس التربة</b><br/>رطوبة ${s.readings.moisture}% · pH ${s.readings.ph}<br/>${s.linkNote || ""}</div>`

        .openPopup();

    function drawSpreadForecast(group) {
      const t = FARM.infection.target;
      const u = FARM.report.untreated;
      const rings = [
        { r: u.nowRadiusM, color: INFECT, label: "الآن", opacity: 0.22 },
        { r: u.week2RadiusM, color: "#EA580C", label: "بعد أسبوعين بدون علاج", opacity: 0.12 },
        { r: u.month1RadiusM, color: "#991B1B", label: "بعد شهر بدون علاج", opacity: 0.08 },
      ];
      rings.forEach((ring) => {
        group.addLayer(
          L.circle(t, {
            radius: ring.r,
            color: ring.color,
            weight: 2,
            fillColor: ring.color,
            fillOpacity: ring.opacity,
            dashArray: ring.r === u.nowRadiusM ? "6 8" : "2 6",
          }).bindPopup(`<div dir="rtl"><b>${ring.label}</b><br/>نصف القطر ≈ ${ring.r} م</div>`)
        );
      });
      return L.circle(t, { radius: u.month1RadiusM });
    }

    function farmAreaHa() {
      try {
        // تقدير بسيط من حدود المزرعة
        const b = L.latLngBounds(FARM.boundary);
        const sw = b.getSouthWest();
        const ne = b.getNorthEast();
        const mLat = (ne.lat - sw.lat) * 110860;
        const mLng = (ne.lng - sw.lng) * 98400 * Math.cos((FARM.center[0] * Math.PI) / 180);
        return Math.max(0.1, (mLat * mLng) / 10000);
      } catch (_) {
        return 12;
      }
    }

    function wait(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    function buildKpiPack(data) {
      const u = FARM.report.untreated;
      const areaNow = (Math.PI * u.nowRadiusM ** 2) / 10000;
      const area1m = (Math.PI * u.month1RadiusM ** 2) / 10000;
      const growthPct = Math.round(((area1m - areaNow) / areaNow) * 100);
      return {
        wasteTons: data.wasteTons,
        wasteSites: data.wasteCount,
        humidityMax: Math.max(...(FARM.infection.humidityPoints || []).map(h => h.value), 0),
        peakCwsi: peakCwsi || (lastThermal ? lastThermal.sample.cwsi : 0),
        lastTc: lastThermal ? lastThermal.sample.Tc : null,
        soilMoisture: data.soil.moisture,
        soilScore: data.soil.score,
        infectRadiusM: FARM.infection.radiusM,
        areaNowHa: Number(areaNow.toFixed(2)),
        areaMonthHa: Number(area1m.toFixed(2)),
        spreadGrowthPct: growthPct,
        farmAreaHa: data.farmAreaHa,
      };
    }

    function downloadBlob(filename, content, mime) {
      const blob = new Blob([content], { type: mime });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    <b>تنبؤ بدون معالجة</b><br/>
    ${u.riskText}<br/>
    الآن ≈ ${u.nowRadiusM}م → بعد أسبوعين ≈ ${u.week2RadiusM}م → بعد شهر ≈ ${u.month1RadiusM}م<br/>
    ${u.spreadNote}
  </div>
  <div class="box good">
    <b>في حال أخذ الخدمة</b><br/>
    ${tr.service}<br/>
    ${tr.benefit}
  </div>
  <div class="box">
    <b>التشخيص الميداني</b><br/>
    ${FARM.infection.diagnosis.cause}<br/>
    ${FARM.infection.diagnosis.fieldFinding}
  </div>
  <p class="no-print" style="color:#6B7C6B;font-size:12px">للطباعة أو حفظ PDF: Ctrl+P ثم «حفظ كـ PDF»</p>
</body>
</html>`;
      downloadBlob(`field-report-KPI-${FARM.id}.html`, html, "text/html;charset=utf-8");
    }

    function bindReportExport(data, kpis) {
      const btnHtml = document.getElementById("btnDlHtml");
      const btnJson = document.getElementById("btnDlJson");
      const btnPrint = document.getElementById("btnPrintReport");
      if (btnHtml) btnHtml.onclick = () => downloadReportHtml(data, kpis);
      if (btnJson) btnJson.onclick = () => downloadReportJson(data, kpis);
      if (btnPrint) btnPrint.onclick = () => {
        downloadReportHtml(data, kpis);
        setTimeout(() => alert("تم تنزيل ملف التقرير. افتحيه ثم اضغطي Ctrl+P لحفظه PDF."), 300);
      };
    }

    function infectNextLabel() {
      if (!observationDone) return "تشغيل نافذة الرصد الحراري";
      if (!pathShown) return "تشغيل مسار الفريق";
      return "التالي: حساس التربة";
    }

    function updateButtons() {
      const btnBack = document.getElementById("btnBack");
      const btnNext = document.getElementById("btnNext");
      btnBack.disabled = step === 0;
      const labels = [
        "تشغيل مسح الدرون",
        scanDone ? "التالي: رصد المخلفات" : "تشغيل المسح",
        "التالي: رصد الإصابة",
        infectNextLabel(),
        "التالي: التقرير والتنبؤ",
        "إعادة الاختبار",
      ];
      btnNext.textContent = labels[step];
    }

    async function goNext() {
      if (editMode) {
        alert("احفظي أو ألغي تعديل الحواف أولًا");
        return;
      }
      const id = STEPS[step].id;

      if (id === "farm") {
        step = 1;
        renderDots();
        renderStepBody();
        updateButtons();
        await runDroneScan();
        updateButtons();
        return;
      }
      if (id === "scan") {
        if (!scanDone) {
          await runDroneScan();
          updateButtons();
          return;
        }
        step = 2;
        showWaste();
      } else if (id === "waste") {
        step = 3;
        renderDots();
        updateButtons();
        await enterInfectionThermal();
        updateButtons();
        return;
      } else if (id === "infect") {
        if (!observationDone) {
          await runObservationWindow();
          updateButtons();
          return;
        }
        if (!pathShown) {
          await showTeamPath();
          updateButtons();
          return;
        }
        teardownThermalUi();
        step = 4;
        showSoil();
      } else if (id === "soil") {
        step = 5;
      } else {
        // إعادة
        teardownThermalUi();
        step = 0;
        scanDone = false;
        logLines = [];
        observationDone = false;
        pathShown = false;
        thermalDots = [];
        destroyThermalAg();
        peakCwsi = 0;
        lastThermal = null;
        clearAllOverlays();
        showFarm();
      }

      renderDots();
      renderStepBody();
      updateButtons();
    }

    function goBack() {
      if (step === 0) return;
      if (STEPS[step].id === "infect") teardownThermalUi();
      step -= 1;
      clearAllOverlays();
      if (step === 0) showFarm();
      else if (step === 1) { showFarm(); setStatus(`مسح الدرون · <strong>${scanDone ? "مكتمل" : "جاهز"}</strong>`); }
      else if (step === 2) showWaste();
      else if (step === 3) {
        enterInfectionThermal();
        renderDots();
        updateButtons();
        return;
      } else if (step === 4) showSoil();
      renderDots();
      renderStepBody();
      updateButtons();
    }

    document.getElementById("stepContent").addEventListener("wheel", (e) => {
      const el = e.currentTarget;
      el.scrollTop += e.deltaY;
      e.stopPropagation();
    }, { passive: true });
    document.getElementById("btnNext").addEventListener("click", () => goNext());
    document.getElementById("btnBack").addEventListener("click", goBack);

    // init
    map.pm.setLang("ar");
    map.pm.addControls({
      position: "topleft",
      drawMarker: false,
      drawCircleMarker: false,
      drawPolyline: false,
      drawRectangle: false,
      drawPolygon: false,
      drawCircle: false,
      drawText: false,
      cutPolygon: false,
      rotateMode: false,
      removalMode: false,
      editMode: false,
      dragMode: false,
    });
    // إخفاء شريط أدوات Geoman — نستخدم أزرارنا فقط
    const pmBar = document.querySelector(".leaflet-pm-toolbar");
    if (pmBar) pmBar.style.display = "none";

    showFarm();
    renderDots();
    renderStepBody();
    updateButtons();
    window.__fieldScan = {
      gotoInfect() {
        step = 3;
        renderDots();
        return enterInfectionThermal().then(() => updateButtons());
      },
    };
  </script>
</body>
</html>
